name: Native build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report toolchain
        run: swift --version
      - name: Run XCTest
        run: swift test -j 2
      - name: Build native app
        run: bash scripts/build-app.sh
      - name: Validate bundle
        run: python3 scripts/verify-bundle.py build/Velinshot.app
      - name: Package native build
        run: ditto -c -k --keepParent build/Velinshot.app build/Velinshot-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Velinshot-${{ runner.arch }}
          path: build/Velinshot-${{ runner.arch }}.zip
          retention-days: 14
