name: Bug report
description: Help make a capture, edit or export work correctly.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the steps, expected result and actual result. Synthetic screenshots work best.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, macOS version and Mac architecture
      placeholder: Preview 1, macOS 15.7, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How did you install Velinshot?
      options:
        - Downloaded preview
        - Built from source
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction details
      description: Include the exact error, capture mode or file type. For capture issues, note whether Screen Recording is enabled for this installed app copy.
